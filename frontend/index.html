<!doctype html>
<!--
  index.html
  WHAT THIS FILE IS: the single HTML page the whole website lives inside.
  WHAT IT DOES: gives the browser the page title and icon, then loads src/main.jsx,
  which draws everything else with React inside the <div id="root"> below.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#246b3b" />
    <meta
      name="description"
      content="UploadHub is a cloud file-management platform for departments at the University of Nigeria, Nsukka. Store, organise, share and track files in one place."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>UploadHub</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
